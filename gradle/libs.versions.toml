[versions]
#project
project-minSdk = "24"
project-compileSdk = "35"
project-targetSdk = "35"

#build
agpVersion = "8.10.0"
agpLibraryVersion = "8.3.2"
kotlinVersion = "1.9.0"

#library
coreKtx = "1.9.0"
appcompat = "1.6.1"
material = "1.9.0"
fragmentKtx = "1.4.0"
constraintlayout = "2.1.4"
room = "2.5.1"
dagger = "2.24"
fastadapter = "5.7.0"
glide = "4.16.0"
gson = "2.11.0"
okhttp = "4.9.3"
coil = "2.7.0"
androidSpantastic = "1.0.0"
junit = "4.13.2"
json = "20231013"
composeBom = "2023.09.02"
composeCompiler = "1.5.2"
activityCompose = "1.7.2"
# 2.8+ needs Compose 1.7; keep on 2.7.x while Compose is pinned to 1.5.2
navigationCompose = "2.7.7"
# Matches what navigation-compose 2.7.7 already pulls in transitively
lifecycleViewmodelCompose = "2.6.2"
robolectric = "4.12.2"
androidxTestCore = "1.5.0"
appmetrica = "8.5.1"

[libraries]
coreKtx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
material = { module = "com.google.android.material:material", version.ref = "material" }
fragmentKtx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragmentKtx" }
constraintlayout = { module = "androidx.constraintlayout:constraintlayout", version.ref = "constraintlayout" }
room-common = { module = "androidx.room:room-common", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
dagger-android = { module = "com.google.dagger:dagger-android", version.ref = "dagger" }
dagger-compiler = { module = "com.google.dagger:dagger-compiler", version.ref = "dagger" }
fastadapter = { module = "com.mikepenz:fastadapter", version.ref = "fastadapter" }
fastadapter-binding = { module = "com.mikepenz:fastadapter-extensions-binding", version.ref = "fastadapter" }
fastadapter-expandable = { module = "com.mikepenz:fastadapter-extensions-expandable", version.ref = "fastadapter" }
glide = { module = "com.github.bumptech.glide:glide", version.ref = "glide" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
coil = { module = "io.coil-kt:coil", version.ref = "coil" }
android-spantastic = { module = "com.github.wellingtoncabral:android-spantastic", version.ref = "androidSpantastic" }
junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
appmetrica-analytics = { module = "io.appmetrica.analytics:analytics", version.ref = "appmetrica" }

[plugins]
androidApplication = { id = "com.android.tools.build:gradle", version.ref = "agpVersion" }
androidLibrary = { id = "com.android.tools.build:gradle", version.ref = "agpLibraryVersion" }
kotlinAndroid = { id = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinVersion" }
kotlinJvm = { id = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlinVersion" }
